name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

# Grant the workflow the security permissions required to publish a site
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent concurrent deployments from overlapping or clashing
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up GitHub Pages settings
        uses: actions/configure-pages@v5

      - name: Package and upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy static site live
        id: deployment
        uses: actions/deploy-pages@v4
